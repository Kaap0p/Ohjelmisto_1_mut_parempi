<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Houses</title>
</head>
<body>

<script>
    const name = prompt("Enter your name:");
    const randomNumber = Math.floor(Math.random() * 4) + 1;

    let house;

    if (randomNumber === 1)
    {
        house = "Gryffindor";

    } else if (randomNumber === 2)
    {
        house = "Slytherin";

    } else if (randomNumber === 3)
    {
        house = "Hufflepuff";
    } else {
        house = "Ravenclav";
    }

    document.body.innerHTML
        = `
    <p> ${name}, you are ${house}. </p>
`;
</script>

</body>
</html>
